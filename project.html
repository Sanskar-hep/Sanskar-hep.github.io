<section style="padding-top:64px;">
  <div class="wrap" style="max-width:760px;">

    <a href="projects.html" class="card-link" style="margin-bottom:28px; display:inline-block;">← Back to Projects</a>

    <div id="project-loading" class="empty-note">Loading…</div>

    <div id="project-content" hidden>
      <p class="eyebrow">Project</p>
      <h2 id="project-title" style="font-family:var(--font-display); font-size:clamp(1.8rem,4vw,2.4rem); margin:0 0 16px;"></h2>
      <div class="tag-row" id="project-tags" style="margin-bottom:28px;"></div>
      <a id="project-goto" class="btn btn-primary" target="_blank" rel="noopener" style="margin-bottom:32px;">Go to project →</a>
      <div id="project-description" class="readme-body" style="max-height:none;"></div>
    </div>

    <div id="project-notfound" class="empty-note" hidden>
      Couldn't find that project. <a href="projects.html">Back to Projects</a>.
    </div>

  </div>
</section>

<footer>
  <div class="wrap">
    <span>© <span id="year"></span> Sanskar. Built and hosted on GitHub Pages.</span>
    <span><a href="contact.html">Get in touch →</a></span>
  </div>
</footer>

<script src="js/projects-data.js"></script>
<script src="js/main.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  (function () {
    function slugify(str) {
      return str.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }

    var loading = document.getElementById('project-loading');
    var content = document.getElementById('project-content');
    var notfound = document.getElementById('project-notfound');

    var slug = new URLSearchParams(window.location.search).get('slug');
    var list = (typeof CUSTOM_PROJECTS !== 'undefined') ? CUSTOM_PROJECTS : [];
    var project = list.find(function (p) { return (p.slug || slugify(p.name)) === slug; });

    if (!project) {
      loading.hidden = true;
      notfound.hidden = false;
    } else {
      document.title = project.name + ' — Sanskar';
      document.getElementById('project-title').textContent = project.name;

      var tagsHtml = (project.tags || []).map(function (t) {
        return '<span class="tag">' + t + '</span>';
      }).join('');
      document.getElementById('project-tags').innerHTML = tagsHtml;
      document.getElementById('project-goto').href = project.url;

      function renderDescription(text) {
        loading.hidden = true;
        content.hidden = false;
        document.getElementById('project-description').innerHTML = marked.parse(text || 'No description provided.');
      }

      if (project.readmeRepo) {
        fetch('https://api.github.com/repos/' + project.readmeRepo + '/readme', {
          headers: { Accept: 'application/vnd.github.v3.raw' }
        }).then(function (res) {
          if (!res.ok) throw new Error('No README');
          return res.text();
        }).then(renderDescription).catch(function () {
          renderDescription('Could not load the README for this repository.');
        });
      } else {
        renderDescription(project.description);
      }
    }
  })();
</script>
</body>
</html>
